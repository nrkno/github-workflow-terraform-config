on:
  pull_request:
    branches:
      - main

name: Autodoc
permissions: {}

jobs:
  autodoc:
    name: Update workflow documentation
    runs-on: ubuntu-latest
    # The push uses the deploy key, not the workflow token.
    permissions:
      contents: read
    steps:
      -
        name: Configure Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
      -
        name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          ssh-key: "${{ secrets.SSH_KEY_AUTODOC }}"
      -
        # The generator comes from the base branch, never from the pull request, so
        # code from a branch does not run while the deploy key is loaded.
        name: Update documentation
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install pyyaml==6.0.3
          mkdir -p "${RUNNER_TEMP}/autodoc"
          git show "origin/${BASE_REF}:.github/scripts/autodoc.py" > "${RUNNER_TEMP}/autodoc/autodoc.py"
          python "${RUNNER_TEMP}/autodoc/autodoc.py" .github/workflows/workflow.yaml README.md
      -
        # The key is loaded only for the commit and push.
        name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: "${{ secrets.SSH_KEY_AUTODOC }}"
      -
        name: Commit and push documentation
        run: |
          # Exit early if no changes were made
          if [[ -z "$(git status --porcelain README.md)" ]]
          then
            echo "Nothing to do!"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update readme with autodoc"
          git push
